<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraud Risk Monitor</title>
  <style>
    :root {
      --bg: #120f0d; --panel: #1c1713; --line: #3a2f26; --text: #f3ebe2;
      --muted: #b59f8c; --accent: #ff8a4c; --ok: #7dcea0; --danger: #ff6b6b; --warn: #f0c24b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--text);
      font-family: "Source Sans 3", "Noto Sans KR", sans-serif;
      background: radial-gradient(900px 500px at 90% -20%, #3a2418 0%, transparent 50%), var(--bg);
      min-height: 100vh;
    }
    header { padding: 28px 32px 12px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 8px 0 0; color: var(--muted); }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px 32px 0; }
    .metric, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .metric { padding: 12px; }
    .metric .label { color: var(--muted); font-size: 0.75rem; }
    .metric .value { font-size: 1.3rem; margin-top: 4px; }
    main { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; padding: 16px 32px 40px; }
    .panel { padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 0.75rem; }
    tr { cursor: pointer; }
    tr:hover td, tr.active td { background: rgba(255,138,76,0.08); }
    .score.high { color: var(--danger); font-weight: 700; }
    .score.mid { color: var(--warn); font-weight: 700; }
    .score.low { color: var(--ok); font-weight: 700; }
    .pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; margin: 0 6px 6px 0; font-size: 0.72rem; color: var(--muted); }
    .pill.hot { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
    button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; margin-right: 8px; }
    button.primary { background: var(--accent); color: #2a1408; border-color: var(--accent); font-weight: 700; }
    pre { background: #0e0b09; border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-size: 0.8rem; max-height: 260px; overflow: auto; }
    @media (max-width: 980px) { main, .metrics { grid-template-columns: 1fr; padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>Fraud Risk Monitor</h1>
    <p>Supervised vs Anomaly · Feature factors — Project B</p>
  </header>
  <div class="metrics">
    <div class="metric"><div class="label">Users</div><div class="value" id="m-users">-</div></div>
    <div class="metric"><div class="label">Avg Supervised</div><div class="value" id="m-avg">-</div></div>
    <div class="metric"><div class="label">Agreement</div><div class="value" id="m-agree">-</div></div>
    <div class="metric"><div class="label">Models</div><div class="value" id="m-model" style="font-size:0.95rem;">-</div></div>
  </div>
  <main>
    <section class="panel">
      <div style="margin-bottom:12px;">
        <button class="primary" id="btn-refresh">Refresh</button>
        <button id="btn-eval">Compare Models</button>
        <a href="/docs" style="color:var(--muted);float:right;margin-top:8px;">API Docs</a>
      </div>
      <h2>Users by Risk</h2>
      <table>
        <thead><tr><th>User</th><th>Supervised</th><th>Anomaly</th><th>Δ</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <section class="panel">
      <h2>Detail</h2>
      <div id="detail" style="color:var(--muted);">사용자를 선택하세요.</div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let rows = [], selected = null;
    const cls = (v) => v >= 65 ? "high" : v >= 40 ? "mid" : "low";

    async function loadOverview() {
      const data = await (await fetch("/v1/dashboard/overview")).json();
      rows = data.users || [];
      $("m-users").textContent = data.user_count;
      $("m-avg").textContent = (data.avg_supervised || 0).toFixed(1);
      $("m-agree").textContent = Math.round((data.agreement_rate || 0) * 100) + "%";
      $("m-model").textContent = data.model?.supervised_loaded ? "gbr+iforest" : "heuristic";
      render();
    }

    function render() {
      const body = $("tbody");
      body.innerHTML = "";
      [...rows].sort((a,b) => b.supervised_score - a.supervised_score).forEach(row => {
        const tr = document.createElement("tr");
        if (row.user_id === selected) tr.classList.add("active");
        tr.innerHTML = `<td>${row.user_id}</td>
          <td class="score ${cls(row.supervised_score)}">${row.supervised_score.toFixed(1)}</td>
          <td class="score ${cls(row.anomaly_score)}">${row.anomaly_score.toFixed(1)}</td>
          <td>${row.delta.toFixed(1)}</td>`;
        tr.onclick = () => selectUser(row.user_id);
        body.appendChild(tr);
      });
    }

    async function selectUser(id) {
      selected = id;
      render();
      const cmp = await (await fetch(`/v1/users/${id}/compare`)).json();
      const feats = await (await fetch(`/v1/users/${id}/features`)).json();
      const factors = Object.entries(cmp.supervised.factors || {})
        .map(([k,v]) => `<span class="pill ${v==="HIGH"?"hot":""}">${k}: ${v}</span>`).join("");
      $("detail").innerHTML = `
        <div><strong>${id}</strong> · agreement=${cmp.agreement}</div>
        <div style="margin:8px 0;">Supervised <span class="score ${cls(cmp.supervised.risk_score)}">${cmp.supervised.risk_score}</span>
          / Anomaly <span class="score ${cls(cmp.anomaly.risk_score)}">${cmp.anomaly.risk_score}</span></div>
        <div>${factors}</div>
        <h2 style="margin-top:16px;">Features</h2>
        <pre>${JSON.stringify(feats, null, 2)}</pre>`;
    }

    async function runEval() {
      const data = await (await fetch("/v1/evaluation/compare")).json();
      alert(`Supervised P/R=${data.supervised_precision}/${data.supervised_recall}\nAnomaly P/R=${data.anomaly_precision}/${data.anomaly_recall}\nAgreement=${data.agreement_rate}`);
      await loadOverview();
    }

    $("btn-refresh").onclick = loadOverview;
    $("btn-eval").onclick = runEval;
    loadOverview();
  </script>
</body>
</html>
