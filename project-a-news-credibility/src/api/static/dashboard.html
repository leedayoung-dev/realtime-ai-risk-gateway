<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Credibility Monitor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e26;
      --line: #2a3542;
      --text: #e7eef6;
      --muted: #8fa3b8;
      --accent: #3dd6c6;
      --warn: #f0b429;
      --danger: #ff6b6b;
      --ok: #6bcb77;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a33 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px 32px 12px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      padding: 20px 32px 40px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }
    .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 980px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .metric .label { color: var(--muted); font-size: 0.75rem; }
    .metric .value { font-size: 1.35rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    tr { cursor: pointer; }
    tr:hover td { background: rgba(61, 214, 198, 0.06); }
    tr.active td { background: rgba(61, 214, 198, 0.12); }
    .score {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .score.high { color: var(--danger); }
    .score.mid { color: var(--warn); }
    .score.low { color: var(--ok); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      margin: 0 6px 6px 0;
    }
    .pill.hot { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); color: var(--danger); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0c1116;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: #c9d7e6;
      max-height: 280px;
      overflow: auto;
    }
    .row-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #06221f;
      border-color: var(--accent);
      font-weight: 650;
    }
    button:hover { filter: brightness(1.08); }
    .muted { color: var(--muted); }
    .history {
      display: flex;
      gap: 6px;
      align-items: end;
      height: 72px;
      margin-top: 8px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent), #1b6f68);
      border-radius: 4px 4px 0 0;
      min-width: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>News Credibility Monitor</h1>
    <p>검증 필요도(Risk) · Claim / Evidence · Early Detection — Project A</p>
  </header>

  <div style="padding: 16px 32px 0;">
    <div class="metrics" id="metrics">
      <div class="metric"><div class="label">Articles</div><div class="value" id="m-articles">-</div></div>
      <div class="metric"><div class="label">Avg Risk</div><div class="value" id="m-avg">-</div></div>
      <div class="metric"><div class="label">Early Detection</div><div class="value" id="m-early">-</div></div>
      <div class="metric"><div class="label">Model</div><div class="value" id="m-model" style="font-size:1rem;">-</div></div>
    </div>
  </div>

  <main>
    <section class="panel">
      <div class="row-actions">
        <button class="primary" id="btn-refresh">Refresh</button>
        <button id="btn-collect">Collect Fixture RSS</button>
        <button id="btn-eval">Run Early Detection Eval</button>
        <a class="muted" href="/docs" style="margin-left:auto;align-self:center;color:var(--muted);">API Docs</a>
      </div>
      <h2>Articles by Risk</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Source</th>
            <th>Risk</th>
          </tr>
        </thead>
        <tbody id="article-body"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Detail</h2>
      <div id="detail" class="muted">왼쪽에서 기사를 선택하세요.</div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let rows = [];
    let selected = null;

    function scoreClass(v) {
      if (v >= 65) return "high";
      if (v >= 40) return "mid";
      return "low";
    }

    async function loadOverview() {
      const res = await fetch("/v1/dashboard/overview");
      const data = await res.json();
      rows = data.articles || [];
      $("m-articles").textContent = data.article_count ?? rows.length;
      $("m-avg").textContent = (data.avg_risk ?? 0).toFixed(1);
      $("m-early").textContent = data.early_detection
        ? `${Math.round(data.early_detection.early_detection_rate * 100)}%`
        : "-";
      $("m-model").textContent = data.model?.loaded ? data.model.backend : "heuristic";
      renderTable();
      if (selected) {
        const still = rows.find(r => r.article_id === selected);
        if (still) selectArticle(selected);
      }
    }

    function renderTable() {
      const body = $("article-body");
      body.innerHTML = "";
      const sorted = [...rows].sort((a, b) => b.risk_score - a.risk_score);
      for (const row of sorted) {
        const tr = document.createElement("tr");
        if (row.article_id === selected) tr.classList.add("active");
        tr.innerHTML = `
          <td>${row.article_id}</td>
          <td>${row.title}</td>
          <td>${row.source}</td>
          <td class="score ${scoreClass(row.risk_score)}">${row.risk_score.toFixed(1)}</td>
        `;
        tr.onclick = () => selectArticle(row.article_id);
        body.appendChild(tr);
      }
    }

    async function selectArticle(id) {
      selected = id;
      renderTable();
      const res = await fetch(`/v1/articles/${id}/analyze`, { method: "POST" });
      const data = await res.json();
      const histRes = await fetch(`/v1/articles/${id}/risk/history`);
      const hist = await histRes.json();

      const factors = Object.entries(data.risk.factors || {})
        .map(([k, v]) => `<span class="pill ${v === "HIGH" ? "hot" : ""}">${k}: ${v}</span>`)
        .join("");

      const claims = (data.claims || [])
        .map(c => `• [${c.claim_type} ${c.confidence}] ${c.text}`)
        .join("\n");

      const evidence = (data.evidence || [])
        .filter(e => e.source !== "gap")
        .map(e => `• (${e.evidence_type}, r=${e.relevance}) ${e.source}: ${e.snippet}`)
        .join("\n");

      const bars = hist.map(h => {
        const height = Math.max(8, Math.round(h.risk_score));
        return `<div class="bar" title="${h.risk_score}" style="height:${height}%"></div>`;
      }).join("");

      $("detail").innerHTML = `
        <div style="margin-bottom:8px;"><strong>${data.title}</strong></div>
        <div class="score ${scoreClass(data.risk.risk_score)}" style="font-size:1.6rem;margin-bottom:8px;">
          ${data.risk.risk_score.toFixed(1)}
        </div>
        <div>${factors}</div>
        <div class="history">${bars || '<span class="muted">no history</span>'}</div>
        <h2 style="margin-top:16px;">Claims</h2>
        <pre>${claims || "(none)"}</pre>
        <h2>Evidence</h2>
        <pre>${evidence || "(none)"}</pre>
      `;
    }

    async function runEval() {
      const res = await fetch("/v1/evaluation/early-detection");
      const data = await res.json();
      alert(
        `Early Detection\n` +
        `rate=${(data.early_detection_rate*100).toFixed(1)}%\n` +
        `precision=${data.precision}\n` +
        `recall=${data.recall}\n` +
        `FPR=${data.false_positive_rate}\n` +
        `avg lead=${data.avg_lead_time_minutes} min`
      );
      await loadOverview();
    }

    async function collectFixture() {
      const res = await fetch("/v1/collect/rss", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ use_fixture: true, max_items: 8, run_pipeline: true })
      });
      const data = await res.json();
      alert(`Collected ${data.collected} from ${data.source}\nprocessed=${data.pipeline?.processed ?? 0}`);
      await loadOverview();
    }

    $("btn-refresh").onclick = loadOverview;
    $("btn-collect").onclick = collectFixture;
    $("btn-eval").onclick = runEval;
    loadOverview().catch(err => {
      $("detail").textContent = "Failed to load overview: " + err;
    });
  </script>
</body>
</html>
